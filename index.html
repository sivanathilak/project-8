<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 8 - Customer Directory</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px;
        }

        .header {
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #bb86fc;
            margin: 0;
        }

        .cart-link {
            background-color: #03dac6;
            color: #000;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .cart-link:hover {
            opacity: 0.85;
        }

        #customer-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }

        .customer-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
        }

        .customer-card h2 {
            margin-top: 0;
            color: #bb86fc;
        }

        .customer-card p {
            color: #bdbdbd;
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background-color: #03dac6;
            color: #000;
        }

        .add-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Customer Directory</h1>

        <a href="cart.html" class="cart-link">
            View Cart (<span id="cart-count">0</span>)
        </a>
    </div>

    <div id="customer-container"></div>

    <script src="script.js"></script>

</body>
</html>
